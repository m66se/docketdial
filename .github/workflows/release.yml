name: Publish release
on:
  push:
    branches: [main]
    paths: [release/VERSION]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 scripts/build.py --check --output "$RUNNER_TEMP/downloads"
      - name: Publish the versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat release/VERSION)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release create "$tag" "$RUNNER_TEMP/downloads/DocketDial.md" "$RUNNER_TEMP/downloads/docketdial.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DocketDial $tag" \
            --notes-file "release/$tag.md" --latest
